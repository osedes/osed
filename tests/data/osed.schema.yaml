# osed.schema.yaml (v0.1.0)

$schema: "https://json-schema.org/draft/2020-12/schema"
title: OSED Document Schema
type: object
required:
  - osed
  - entities
properties:
  osed:
    type: string
    description: >-
      Version of the OSED specification (SemVer)
    pattern: "^[0-9]+.[0-9]+.[0-9]+$"

  entities:
    type: array
    items:
      $ref: "#/definitions/entityNamePattern"
    description: >-
      List of described entities in this document

  universals:
    type: array
    description: >-
      Common nouns with valid semantics both within and outside the system
    items:
      $ref: "#/definitions/semanticNode"

  particulars:
    type: array
    description: >-
      Nouns with clearly defined semantics within the system's context
    items:
      $ref: "#/definitions/semanticNode"

propertyNames:
  $ref: "#/definitions/entityNamePattern"

definitions:
  entityNamePattern:
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9._-]*$"

  semanticNode:
    description: >-
      A recursive structure used in universals/particulars
    anyOf:
      - type: string
      - $ref: "#/definitions/namedNodeGroup"

  namedNodeGroup:
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties:
      type: array
      minItems: 1
      items:
        $ref: "#/definitions/semanticNode"

  flatListOfStrings:
    type: array
    items:
      type: string
    description: >-
      A flat list of strings used for enums, labels, or categories

  valueDescription:
    description: >-
      A map whose keys are strings and whose values must be either:
      - a string referring to a universal, particular, or entity
      - another valueDescription (for nested structure)
      - or a flat list of strings (e.g., enums or labels).
      Only these three forms are valid. Booleans, nulls, or other scalar
      types are not permitted.
    anyOf:
      - type: object
        additionalProperties:
          anyOf:
            - type: string
            - $ref: "#/definitions/valueDescription"
      - $ref: "#/definitions/flatListOfStrings"

additionalProperties:
  anyOf:
    - type: string
    - $ref: "#/definitions/flatListOfStrings"
    - $ref: "#/definitions/valueDescription"

# Note:
# Special Value Descriptions (type: list / map) intentionally excluded from
# core. They are to be handled in downstream metadata extensions (e.g.,
# DBMS-specific).
