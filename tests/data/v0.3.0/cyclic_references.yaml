osed: '0.3.0'
entities:
  - user
  - order
  - product
  - category

universals:
  - email
  - name
  - description

particulars:
  - userId
  - orderId
  - productId

user:
  id:
    type: String
    required: true
  name:
    type: String
    required: true
  orders:
    type: Array
    items:
      ref: order

order:
  id:
    type: String
    required: true
  user:
    ref: user
  products:
    type: Array
    items:
      ref: product

product:
  id:
    type: String
    required: true
  name:
    type: String
    required: true
  category:
    ref: category

category:
  id:
    type: String
    required: true
  name:
    type: String
    required: true
  products:
    type: Array
    items:
      ref: product
