osed: '0.3.0'
driver: 'mongoose'

entities:
  - Person
  - Post

universals:
  - name
  - password
  - contact:
      - email
      - phone
  - string
  - objectid

particulars:
  - systemId

Person:
  id: systemId
  password: password
  name: name
  email: email
  phone: phone
  posts:
    type: array
    of: objectid
    ref: Post
  # Invalid: using 'mongoose:' prefix in driver-based approach
  profile:
    mongoose:type: objectid
    mongoose:ref: Post
  # Valid: using 'value' for map type (now supported)
  metadata:
    type: map
    value: string
  # Invalid: using invalid type that's not in the enum
  invalidField:
    type: invalid_type
  # Invalid: mixing 'of' and 'items' with different values
  mixedField:
    type: array
    of: string
    items: objectid
  # Invalid: using 'unique' with non-boolean value (not covered in other tests)
  uniqueField:
    type: string
    unique: 'not_a_boolean'
