osed: '0.3.0'
driver: 'mongoose-mongo'

entities:
  - Person
  - Post
  - Comment

universals:
  - name
  - password
  - contact:
      - email
      - phone

particulars:
  - systemId

Person:
  id: systemId
  password: password
  name: name
  email: email
  phone: phone
  posts:
    type: array
    items: Post
  comments:
    type: map
    key: systemId
    value: Comment

Post:
  id: systemId
  title: string
  content: string

Comment:
  id: systemId
  content: string
  post: Post
  author: Person
